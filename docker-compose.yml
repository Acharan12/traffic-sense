version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: ts-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: trafficsense
    networks:
      - ts-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ts-backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/trafficsense
      - JWT_SECRET=${JWT_SECRET:-changeme_in_production}
      - ML_SERVICE_URL=http://ml-service:8000
      - DEMO_MODE=${DEMO_MODE:-true}
      - FRONTEND_URL=http://localhost:5173
      - NEWS_API_KEY=${NEWS_API_KEY:-}
      - WEATHER_API_KEY=${WEATHER_API_KEY:-}
      - ROUTING_API_KEY=${ROUTING_API_KEY:-}
      - NODE_ENV=production
    depends_on:
      - mongodb
    networks:
      - ts-network

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: ts-ml-service
    restart: unless-stopped
    ports:
      - '8000:8000'
    volumes:
      - ./ml-service/models:/app/models
      - ./ml-service/data:/app/data
    networks:
      - ts-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:5000/api
    container_name: ts-frontend
    restart: unless-stopped
    ports:
      - '3000:80'
    depends_on:
      - backend
    networks:
      - ts-network

volumes:
  mongo-data:

networks:
  ts-network:
    driver: bridge
